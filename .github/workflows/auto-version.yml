name: Auto Version Management

on:
  push:
    branches: [ main, latest ]
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write
  pull-requests: write

# Serialize runs per branch so two quick merges don't race on the version.json
# push (the non-fast-forward failures). Queue, don't cancel — every merge still
# gets its version bump.
concurrency:
  group: auto-version-${{ github.ref }}
  cancel-in-progress: false

jobs:
  auto-version:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Full history for accurate commit count
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
    
    - name: Get version information
      id: version
      run: |
        # Get git information
        echo "commit_count=$(git rev-list --count HEAD)" >> $GITHUB_OUTPUT
        echo "commit_hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
        echo "branch=$(git rev-parse --abbrev-ref HEAD)" >> $GITHUB_OUTPUT
        echo "commit_date=$(git log -1 --format=%cd --date=short)" >> $GITHUB_OUTPUT
        
        # Display version info
        echo "📊 Version Information:"
        echo "   Commit Count: $(git rev-list --count HEAD)"
        echo "   Commit Hash: $(git rev-parse --short HEAD)"
        echo "   Branch: $(git rev-parse --abbrev-ref HEAD)"
        echo "   Date: $(git log -1 --format=%cd --date=short)"
    
    - name: Update version files
      run: |
        # Debug: show current directory and files
        echo "Current directory: $(pwd)"
        echo "Files in current directory:"
        ls -la
        
        echo "Checking version.py exists:"
        if [ -f "version.py" ]; then
          echo "✅ version.py found"
          python --version
          python version.py --update
        else
          echo "❌ version.py not found!"
          exit 1
        fi
        
        # Display updated files
        echo "📁 Updated version files:"
        echo "   version.json:"
        cat version.json
        echo ""
        echo "   .env:"
        cat .env
    
    - name: Commit and push version updates
      run: |
        # Configure git
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # Add only version.json (not .env since it's in .gitignore)
        git add version.json
        
        # Check if there are changes
        if git diff --staged --quiet; then
          echo "✅ No version changes to commit"
          exit 0
        fi

        # Commit changes
        git commit -m "🤖 Auto-update version to v${{ steps.version.outputs.commit_count }}.${{ steps.version.outputs.commit_hash }}"

        BRANCH="${{ steps.version.outputs.branch }}"

        # Push with rebase+retry. If another run (or a human) pushed in the
        # meantime, the branch tip moves and a plain push is rejected
        # non-fast-forward. Rebase our single version commit on top of the new
        # tip and retry. version.json is the only file we touch, and the rebase
        # regenerates it cleanly, so this converges.
        for attempt in 1 2 3 4 5; do
          echo "🔄 Push attempt $attempt to $BRANCH..."
          if git push origin "HEAD:$BRANCH"; then
            echo "✅ Version files committed and pushed successfully"
            exit 0
          fi
          echo "⚠️  Push rejected — fetching and rebasing, then retrying..."
          git fetch origin "$BRANCH"
          # Drop our commit, take theirs, recompute version on top.
          git reset --hard "origin/$BRANCH"
          python version.py --update
          if git diff --quiet -- version.json; then
            echo "✅ Version already current on remote — nothing to push"
            exit 0
          fi
          git add version.json
          git commit -m "🤖 Auto-update version to v${{ steps.version.outputs.commit_count }}.${{ steps.version.outputs.commit_hash }}"
        done

        echo "❌ Failed to push after retries"
        git status
        exit 1
    
    - name: Create summary
      run: |
        echo "## 🚀 Auto Version Update Complete!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Version:** v${{ steps.version.outputs.commit_count }}.${{ steps.version.outputs.commit_hash }}" >> $GITHUB_STEP_SUMMARY
        echo "**Branch:** ${{ steps.version.outputs.branch }}" >> $GITHUB_STEP_SUMMARY
        echo "**Date:** ${{ steps.version.outputs.commit_date }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📁 Files Updated:" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ version.json" >> $GITHUB_STEP_SUMMARY
        echo "- ℹ️ .env (not committed - use for Portainer deployment)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🔧 Next Steps:" >> $GITHUB_STEP_SUMMARY
        echo "1. Copy the .env values below for Portainer deployment:" >> $GITHUB_STEP_SUMMARY
        echo "   GIT_COMMIT_COUNT=${{ steps.version.outputs.commit_count }}" >> $GITHUB_STEP_SUMMARY
        echo "   GIT_COMMIT_HASH=${{ steps.version.outputs.commit_hash }}" >> $GITHUB_STEP_SUMMARY
        echo "   GIT_BRANCH=${{ steps.version.outputs.branch }}" >> $GITHUB_STEP_SUMMARY
        echo "   GIT_COMMIT_DATE=${{ steps.version.outputs.commit_date }}" >> $GITHUB_STEP_SUMMARY
        echo "2. Update your Portainer stack environment variables" >> $GITHUB_STEP_SUMMARY
        echo "3. Redeploy to get the latest version" >> $GITHUB_STEP_SUMMARY
        echo "4. Test the version form interface" >> $GITHUB_STEP_SUMMARY
